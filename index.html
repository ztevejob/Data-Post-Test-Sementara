<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilai Post Test Sementara - MAPTECH</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse for Google Sheets CSV Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f4f7fe;
            color: #2b3674;
        }

        .text-neon-green {
            color: #39ff14;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
            text-align: center;
        }

        .badge-lulus { background-color: #e6f9f0; color: #05cd99; }
        .badge-remidi { background-color: #ffeef0; color: #ee5d50; }
        .badge-join { background-color: #e9f3ff; color: #2b77e5; }
        .badge-absent { background-color: #fff8e6; color: #ffb800; }
        .badge-default { background-color: #f4f7fe; color: #707eae; }

        tr.row-status-lulus {
            background-color: #f0fdf4 !important;
        }
        tr.row-status-lulus:hover {
            background-color: #dcfce7 !important;
        }

        tr.row-status-remidi {
            background-color: #fff1f2 !important;
        }
        tr.row-status-remidi:hover {
            background-color: #ffe4e6 !important;
        }

        .table-responsive::-webkit-scrollbar { height: 6px; width: 6px; }
        .table-responsive::-webkit-scrollbar-track { background: #f1f1f1; }
        .table-responsive::-webkit-scrollbar-thumb { background: #c3cadb; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 p-3 md:p-6">

    <!-- MAIN APP WRAPPER -->
    <div class="max-w-7xl mx-auto w-full bg-white rounded-2xl p-4 md:p-6 shadow-sm border border-slate-200">
        
        <!-- ERROR MESSAGE CONTAINER -->
        <div id="error-alert" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation text-rose-500 text-base"></i>
                <span id="error-message-text">Gagal memperbarui data dari Google Sheets. Pastikan hak akses spreadsheet sudah 'Anyone with the link'.</span>
            </div>
            <button onclick="fetchSheetData()" class="px-2.5 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded-lg font-semibold transition-colors">Coba Lagi</button>
        </div>

        <!-- HEADER SECTION -->
        <div class="pb-3 md:pb-4 mb-4 md:mb-6 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
            <div>
                <h2 class="text-lg md:text-2xl font-bold text-slate-900" id="page-title">Nilai Post Test Sementara</h2>
                <p class="text-xs text-slate-400 mt-0.5">Concept & Curation by <span class="text-slate-600 font-semibold">Novi Riyanto</span></p>
            </div>
            <div class="flex items-center gap-2 text-xs text-slate-500 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg w-fit">
                <span class="flex items-center gap-1.5 font-bold text-emerald-600">
                    <i class="fa-solid fa-bolt"></i> AutoSync
                </span>
                <span class="text-slate-300">|</span>
                <span id="sync-timestamp">Memuat...</span>
            </div>
        </div>

        <!-- KARTU STATISTIK UTAMA -->
        <div id="management-stats-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4 mb-6">
            <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-lg">
                    <i class="fa-solid fa-user-group"></i>
                </div>
                <div>
                    <span class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Total Karyawan</span>
                    <h3 id="stat-total-karyawan" class="text-xl font-bold text-slate-800">0</h3>
                </div>
            </div>

            <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-lg">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <span class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Total Peserta (Aktif Sesi)</span>
                    <h3 id="stat-total" class="text-xl font-bold text-slate-800">0</h3>
                </div>
            </div>
        </div>

        <!-- TABEL DATA LANGSUNG DARI FETCH -->
        <div class="table-responsive overflow-x-auto border border-slate-200 rounded-xl max-h-[600px]">
            <table class="w-full text-xs text-left whitespace-nowrap">
                <thead id="table-head" class="bg-slate-100 sticky top-0 z-10 border-b border-slate-200">
                    <!-- Header generated dynamically from fetch -->
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-100 bg-white">
                    <tr>
                        <td class="text-center py-6 text-indigo-600">
                            <i class="fa-solid fa-spinner fa-spin"></i> Memuat data dari Google Sheets...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // ID Spreadsheet Asli
        const SHEET_ID = "1Ckk2YocjioES8EKEkT3bjHy_56tUShglGPBCpYCyh5Y";
        
        // Target URL Resmi Export CSV Google Sheets
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

        let rawData = [];

        const SESSION_KEYS = [
            "8-Sept-2026 Pagi", "8-Sept-2026 Siang",
            "9-Sept-2026 Pagi", "9-Sept-2026 Siang",
            "10-Sept-2026 Pagi", "10-Sept-2026 Siang",
            "11-Sept-2026 Pagi", "11-Sept-2026 Siang"
        ];

        document.addEventListener("DOMContentLoaded", () => {
            fetchSheetData();
        });

        function updateTimestamp() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            document.getElementById("sync-timestamp").innerText = `${dateStr}, ${timeStr} WIB`;
        }

        // Helper untuk mencari data berdasarkan kunci (case-insensitive & trim space)
        function getVal(row, keyName) {
            if (!row) return '-';
            const foundKey = Object.keys(row).find(k => k.trim().toLowerCase() === keyName.toLowerCase());
            if (foundKey && row[foundKey] !== undefined && row[foundKey] !== null) {
                const strVal = String(row[foundKey]).trim();
                return strVal !== '' ? strVal : '-';
            }
            return '-';
        }

        function fetchSheetData() {
            const errorAlert = document.getElementById("error-alert");
            errorAlert.classList.add("hidden");

            fetch(CSV_URL)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.text();
                })
                .then(csvText => {
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        transformHeader: function(header) {
                            return header ? header.trim().replace(/\s+/g, ' ') : '';
                        },
                        complete: function(results) {
                            // Filter baris yang memiliki "Nama" valid
                            rawData = results.data.filter(item => {
                                const nama = getVal(item, 'Nama');
                                return nama !== '-' && nama !== '';
                            });

                            updateTimestamp();
                            renderAllData(rawData, results.meta.fields);
                        },
                        error: function(err) {
                            throw new Error("Gagal memparsing data CSV: " + err.message);
                        }
                    });
                })
                .catch(err => {
                    console.error("Error fetching CSV:", err);
                    errorAlert.classList.remove("hidden");
                });
        }

        function parseScore(val) {
            if (val === undefined || val === null || val === '' || val === '-') return null;
            let str = String(val).replace(',', '.').trim();
            let num = parseFloat(str);
            return isNaN(num) ? null : num;
        }

        function getCalculatedStatus(maxVal) {
            if (maxVal === null || maxVal === undefined) return 'Remidi';
            return maxVal >= 80 ? 'Lulus' : 'Remidi';
        }

        function renderAllData(data, fields) {
            renderDynamicTable(data, fields);
            renderStatsAndSummary(data);
        }

        function renderDynamicTable(data, fields) {
            const thead = document.getElementById("table-head");
            const tbody = document.getElementById("table-body");
            
            thead.innerHTML = "";
            tbody.innerHTML = "";

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td class="text-center py-6 text-slate-400">Data tidak ditemukan di Google Sheets.</td></tr>`;
                return;
            }

            // Gunakan header dari meta parsing CSV jika tersedia, jika tidak ambil dari keys objek pertama
            const headers = fields && fields.length > 0 ? fields : Object.keys(data[0]);

            // 1. Render Header secara langsung dari fetch Google Sheets
            const trHead = document.createElement("tr");
            headers.forEach(headerText => {
                const th = document.createElement("th");
                th.className = "p-3 font-semibold text-slate-700 bg-slate-100";
                
                // Styling khusus untuk kolom sesi tanggal
                if (SESSION_KEYS.some(k => k.toLowerCase() === headerText.toLowerCase())) {
                    th.className += " text-center bg-indigo-50/70";
                }
                
                th.innerText = headerText;
                trHead.appendChild(th);
            });
            
            // Tambahkan Header Status Tambahan jika belum ada di Sheet
            const hasStatusCol = headers.some(h => h.toLowerCase().includes('status remidi'));
            if (!hasStatusCol) {
                const thStatus = document.createElement("th");
                thStatus.className = "p-3 font-semibold text-slate-700 bg-slate-100";
                thStatus.innerText = "Status Remidi / Lulus";
                trHead.appendChild(thStatus);
            }
            
            thead.appendChild(trHead);

            // 2. Render Baris Data
            const fragment = document.createDocumentFragment();

            data.forEach((item) => {
                let rawMaxScore = getVal(item, 'Max Score pt.1');
                if (rawMaxScore === '-') rawMaxScore = getVal(item, 'Max Score');
                const maxVal = parseScore(rawMaxScore);
                const calculatedStatus = getCalculatedStatus(maxVal);

                let rowHighlightClass = calculatedStatus === 'Lulus' ? 'row-status-lulus' : 'row-status-remidi';

                const tr = document.createElement("tr");
                tr.className = `transition-colors ${rowHighlightClass}`;

                headers.forEach(headerText => {
                    const td = document.createElement("td");
                    td.className = "p-3";
                    const cellVal = getVal(item, headerText);

                    // Formating khusus tampilan cell
                    if (SESSION_KEYS.some(k => k.toLowerCase() === headerText.toLowerCase())) {
                        td.className += " text-center";
                        td.innerText = cellVal;
                    } else if (headerText.toLowerCase().includes('join')) {
                        let joinBadgeClass = 'badge-default';
                        if (cellVal.toLowerCase().includes('join') && !cellVal.toLowerCase().includes('tidak')) {
                            joinBadgeClass = 'badge-join';
                        } else if (cellVal.toLowerCase().includes('tidak')) {
                            joinBadgeClass = 'badge-absent';
                        }
                        td.innerHTML = `<span class="badge ${joinBadgeClass}">${cellVal}</span>`;
                    } else if (headerText.toLowerCase().includes('status remidi')) {
                        let statusBadgeClass = calculatedStatus === 'Lulus' ? 'badge-lulus' : 'badge-remidi';
                        td.innerHTML = `<span class="badge ${statusBadgeClass}">${calculatedStatus}</span>`;
                    } else if (headerText.toLowerCase().includes('max score')) {
                        td.className += " text-center font-semibold text-indigo-600";
                        td.innerText = maxVal !== null ? maxVal : cellVal;
                    } else if (headerText.toLowerCase() === 'nama') {
                        td.className += " font-semibold text-slate-900";
                        td.innerText = cellVal;
                    } else {
                        td.innerText = cellVal;
                    }

                    tr.appendChild(td);
                });

                // Jika kolom status belum ada di sheet, lampirkan badge kalkulasi status di akhir
                if (!hasStatusCol) {
                    const tdStatus = document.createElement("td");
                    tdStatus.className = "p-3";
                    let statusBadgeClass = calculatedStatus === 'Lulus' ? 'badge-lulus' : 'badge-remidi';
                    tdStatus.innerHTML = `<span class="badge ${statusBadgeClass}">${calculatedStatus}</span>`;
                    tr.appendChild(tdStatus);
                }

                fragment.appendChild(tr);
            });

            tbody.appendChild(fragment);
        }

        function renderStatsAndSummary(data) {
            const totalKaryawan = data.length;
            let totalPesertaSet = new Set();
            data.forEach((item, index) => {
                const hasSessionScore = SESSION_KEYS.some(h => {
                    const val = getVal(item, h);
                    return val !== '-';
                });
                if (hasSessionScore) totalPesertaSet.add(index);
            });

            document.getElementById("stat-total-karyawan").innerText = totalKaryawan;
            document.getElementById("stat-total").innerText = totalPesertaSet.size;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Performa Pelatihan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Leaflet.js CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    <!-- Top Navigation / Header -->
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold">DP</div>
            <h1 class="text-xl font-bold tracking-wide">Dashboard Performa Pelatihan</h1>
        </div>
        <div class="flex items-center space-x-4">
            <button id="darkModeToggle" class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 transition">
                🌙
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar Khusus Info Staff & Pencarian Filter -->
        <aside class="w-80 bg-slate-800/90 border-r border-slate-700 p-6 flex flex-col space-y-6 overflow-y-auto">
            <div>
                <h2 class="text-lg font-semibold mb-3 text-indigo-400">Pencarian & Filter Staff</h2>
                <input type="text" id="searchInput" placeholder="Cari Nama, NIK, atau Store..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div class="border-t border-slate-700 pt-4 flex-1">
                <h2 class="text-lg font-semibold mb-4 text-indigo-400">Informasi Profil Karyawan</h2>
                <div id="staffProfile" class="space-y-3 text-sm">
                    <p class="text-slate-400 italic">Pilih atau cari karyawan untuk melihat detail informasi.</p>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 p-6 overflow-y-auto space-y-6">
            
            <!-- Metric Cards (Total Karyawan & Total Peserta) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass-card p-6 rounded-2xl shadow-lg border border-slate-700/50">
                    <h3 class="text-sm font-medium text-slate-400">Total Karyawan</h3>
                    <p id="totalKaryawan" class="text-3xl font-bold mt-2 text-indigo-400">0</p>
                </div>
                <div class="glass-card p-6 rounded-2xl shadow-lg border border-slate-700/50">
                    <h3 class="text-sm font-medium text-slate-400">Total Peserta</h3>
                    <p id="totalPeserta" class="text-3xl font-bold mt-2 text-emerald-400">0</p>
                </div>
            </div>

            <!-- Tabel Bottom Stores Digimap (Skipping Nilai Nol) -->
            <div class="glass-card p-6 rounded-2xl shadow-lg border border-slate-700/50">
                <h3 class="text-lg font-semibold mb-4 text-slate-200">Bottom Stores Digimap (Non-Zero Scores)</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="border-b border-slate-700 text-slate-400">
                                <th class="py-3 px-4">Store</th>
                                <th class="py-3 px-4">Rata-rata Nilai</th>
                            </tr>
                        </thead>
                        <tbody id="bottomStoresTable" class="divide-y divide-slate-700/50">
                            <!-- Data populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Script Integrasi Data Berdasarkan Header Target -->
    <script>
        // Header patokan: 
        // No. | Store | Nama | NIK | Work Experience | SEED Registered Email | Positions | 
        // 8-Sept-2026 Pagi | 8-Sept-2026 Siang | 9-Sept-2026 Pagi | 9-Sept-2026 Siang | 
        // 10-Sept-2026 Pagi | 10-Sept-2026 Siang | 11-Sept-2026 Pagi | 11-Sept-2026 Siang | 
        // Keterangan Min Score pt.1 | Max Score pt.1 | Keterangan Join / Tidak Join | Status Remidi / Lulus

        const sessionHeaders = [
            "8-Sept-2026 Pagi", "8-Sept-2026 Siang", 
            "9-Sept-2026 Pagi", "9-Sept-2026 Siang", 
            "10-Sept-2026 Pagi", "10-Sept-2026 Siang", 
            "11-Sept-2026 Pagi", "11-Sept-2026 Siang"
        ];

        // Simulasi struktur data yang memetakan header di atas
        let employeeData = [];

        function renderProfile(employee) {
            const container = document.getElementById('staffProfile');
            if (!employee) {
                container.innerHTML = `<p class="text-slate-400 italic">Karyawan tidak ditemukan.</p>`;
                return;
            }

            container.innerHTML = `
                <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700 space-y-2">
                    <div><span class="text-slate-400 text-xs block">Store</span><span class="font-medium">${employee.store || '-'}</span></div>
                    <div><span class="text-slate-400 text-xs block">Nama</span><span class="font-medium text-indigo-300">${employee.nama || '-'}</span></div>
                    <div><span class="text-slate-400 text-xs block">NIK</span><span class="font-medium">${employee.nik || '-'}</span></div>
                    <div><span class="text-slate-400 text-xs block">Work Experience</span><span class="font-medium">${employee.workExperience || '-'}</span></div>
                    <div><span class="text-slate-400 text-xs block">SEED Registered Email</span><span class="font-medium text-xs break-all">${employee.email || '-'}</span></div>
                    <div><span class="text-slate-400 text-xs block">Positions</span><span class="font-medium">${employee.positions || '-'}</span></div>
                    <div class="border-t border-slate-700 pt-2 mt-2">
                        <span class="text-slate-400 text-xs block mb-1">Kolom Nilai Sesi</span>
                        <div class="grid grid-cols-2 gap-1 text-xs">
                            ${sessionHeaders.map(h => `<span class="bg-slate-800 px-2 py-1 rounded">${h}: <b>${employee.scores[h] ?? 0}</b></span>`).join('')}
                        </div>
                    </div>
                    <div class="border-t border-slate-700 pt-2 mt-2">
                        <span class="text-slate-400 text-xs block">Keterangan Join / Tidak Join</span><span class="font-medium">${employee.joinStatus || '-'}</span>
                    </div>
                    <div><span class="text-slate-400 text-xs block">Status Remidi / Lulus</span><span class="font-medium">${employee.passStatus || '-'}</span></div>
                </div>
            `;
        }

        function updateMetrics(data) {
            // Total Karyawan cari datanya di header nama
            const totalKaryawan = data.filter(emp => emp.nama && emp.nama.trim() !== "").length;
            document.getElementById('totalKaryawan').innerText = totalKaryawan;

            // Total Peserta cari datanya di nilai yang muncul pada header sesi terkait
            const totalPeserta = data.filter(emp => {
                return sessionHeaders.some(h => emp.scores[h] !== undefined && emp.scores[h] !== null && emp.scores[h] !== "");
            }).length;
            document.getElementById('totalPeserta').innerText = totalPeserta;
        }

        function renderBottomStores(data) {
            const tableBody = document.getElementById('bottomStoresTable');
            tableBody.innerHTML = '';

            // Grouping by Store & skipping zero values logic
            let storeScores = {};
            data.forEach(emp => {
                if(!emp.store) return;
                if(!storeScores[emp.store]) storeScores[emp.store] = { total: 0, count: 0 };
                
                sessionHeaders.forEach(h => {
                    let val = parseFloat(emp.scores[h]) || 0;
                    if(val > 0) { // Skip nilai yang nol
                        storeScores[emp.store].total += val;
                        storeScores[emp.store].count += 1;
                    }
                });
            });

            let storeAverages = Object.keys(storeScores).map(store => {
                let avg = storeScores[store].count > 0 ? storeScores[store].total / storeScores[store].count : 0;
                return { store, avg };
            }).filter(s => s.avg > 0).sort((a, b) => a.avg - b.avg); // Ambil bottom stores

            if(storeAverages.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="2" class="py-3 px-4 text-slate-400 italic text-center">Tidak ada data untuk ditampilkan</td></tr>`;
                return;
            }

            storeAverages.forEach(item => {
                let row = document.createElement('tr');
                row.className = "border-b border-slate-700/50 hover:bg-slate-700/20";
                row.innerHTML = `
                    <td class="py-3 px-4 font-medium">${item.store}</td>
                    <td class="py-3 px-4 text-indigo-400">${item.avg.toFixed(2)}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Event listener pencarian filter di sidebar
        document.getElementById('searchInput').addEventListener('input', (e) => {
            let keyword = e.target.value.toLowerCase();
            let matched = employeeData.find(emp => 
                (emp.nama && emp.nama.toLowerCase().includes(keyword)) ||
                (emp.nik && emp.nik.toLowerCase().includes(keyword)) ||
                (emp.store && emp.store.toLowerCase().includes(keyword))
            );
            renderProfile(matched);
        });

        // Dark mode toggle handler
        document.getElementById('darkModeToggle').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });
    </script>
</body>
</html>

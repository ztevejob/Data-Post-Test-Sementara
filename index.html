<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Performa Assessment</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --neon-green: #00ff66; /* Warna Neon Green untuk AutoSync */
            --accent-blue: #38bdf8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        /* Styling AutoSync khusus warna hijau neon */
        .status-autosync {
            color: var(--neon-green);
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            backdrop-filter: blur(10px);
        }

        .summary-card h4 {
            margin: 0 0 8px 0;
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .summary-card .value {
            font-size: 1.6rem;
            font-weight: bold;
        }

        .status-pass { color: #4ade80; }
        .status-remidi { color: #f87171; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(15, 23, 42, 0.8);
            color: var(--accent-blue);
        }
    </style>
</head>
<body>

    <!-- Header Section (Tulisan Assessment Portal Sudah Dihapus) -->
    <header style="margin-bottom: 20px; display: flex; justify: space-between; align-items: center;">
        <h2>Dashboard Live System</h2>
        <div>
            Status: <span id="syncStatus" class="status-autosync">AutoSync Active</span>
        </div>
    </header>

    <!-- Summary Section -->
    <div class="summary-grid">
        <div class="summary-card">
            <h4>Total Karyawan</h4>
            <div class="value" id="totalKaryawan">0</div>
        </div>
        <div class="summary-card">
            <h4>Total Staff Dinilai (VS Total Staff)</h4>
            <div class="value" id="totalPesertaVsStaff">0 / 0</div>
        </div>
        <div class="summary-card">
            <h4>Lulus (Pass)</h4>
            <div class="value status-pass" id="totalLulus">0</div>
        </div>
        <div class="summary-card">
            <h4>Remidi</h4>
            <div class="value status-remidi" id="totalRemidi">0</div>
        </div>
    </div>

    <!-- Data Table -->
    <table>
        <thead>
            <tr>
                <th>Kode Toko</th>
                <th>Username Toko</th>
                <th>Password MAPTech</th>
                <th>Nama Staff</th>
                <th>Max Score pt.1</th>
                <th>Status Assessment</th>
            </tr>
        </thead>
        <tbody id="dataTable">
            <!-- Data dimasukkan melalui JavaScript -->
        </tbody>
    </table>

    <script>
        // Array Kode Toko MAPTech
        const storeCodes = [
            "M108", "M116", "M117", "M118", "M119", "M120", "M121", "M122", "M123", "M124", "M125", "M126", "M127", "M128", "M129", "M130", "M131", 
            "M201", "M203", "M205", "M206", "M212", "M214", "M215", "M216", "M217", "M218", "M219", "M220", "M221", "M222", "M223", "M224", "M225", 
            "M226", "M227", "M228", "M229", "M230", "M231", "M232", "M233", "M234", "M235", "M236", "M237", "M238", "M239", "M240", "M241", "M243", 
            "M244", "M245", "M246", "M247", "M248", "M249", "M250", "M251", "M252", "M253", "M254", "M255", "M256", "M257", "M258", "M259", "M260", 
            "M261", "M262", "M263", "M264", "M265", "M266", "M267", "M268", "M269", "M270", "M271", "M272", "M273", "M274", "M275", "M276", "M277", 
            "M278", "M279", "M281", "M282", "M283", "M284", "M285", "M286", "M287", "M288", "M289", "M290", "M293", "M294", "M295"
        ];

        // Contoh Data Karyawan (Silahkan sesuaikan dengan penarikan data CSV/API Anda)
        const staffData = [
            { storeIndex: 0, name: "Budi Santoso", maxScorePt1: 85 },
            { storeIndex: 1, name: "Siti Rahma", maxScorePt1: 75 },
            { storeIndex: 2, name: "Andi Pratama", maxScorePt1: 90 },
            { storeIndex: 3, name: "Dewi Lestari", maxScorePt1: 60 },
            { storeIndex: 4, name: "", maxScorePt1: null }, // Contoh baris nama kosong
            { storeIndex: 5, name: "Eko Prasetyo", maxScorePt1: 80 }
        ];

        function renderDashboard() {
            const tbody = document.getElementById('dataTable');
            tbody.innerHTML = '';

            let totalKaryawan = 0;
            let totalStaffDinilai = 0;
            let totalLulus = 0;
            let totalRemidi = 0;

            // Loop berdasarkan daftar kode toko
            storeCodes.forEach((code, index) => {
                const staff = staffData[index] || { name: "", maxScorePt1: null };
                
                // Format Username & Password Akun MAPTech
                const username = `user_${code.toLowerCase()}`;
                const password = `maptech#${code}`;

                // Validasi Nama Tidak Kosong
                const hasName = staff.name && staff.name.trim() !== "";
                if (hasName) {
                    totalKaryawan++;
                }

                // Kalkulasi Score & Pass Rate (>= 80 Pass, < 80 Remidi)
                let scoreDisplay = "-";
                let statusDisplay = "-";
                let statusClass = "";

                if (hasName && staff.maxScorePt1 !== null && staff.maxScorePt1 !== undefined) {
                    totalStaffDinilai++;
                    scoreDisplay = staff.maxScorePt1;

                    if (staff.maxScorePt1 >= 80) {
                        statusDisplay = "Pass";
                        statusClass = "status-pass";
                        totalLulus++;
                    } else {
                        statusDisplay = "Remidi";
                        statusClass = "status-remidi";
                        totalRemidi++;
                    }
                }

                // Render Baris Tabel
                const row = `
                    <tr>
                        <td><strong>${code}</strong></td>
                        <td>${username}</td>
                        <td><code>${password}</code></td>
                        <td>${staff.name || '<span style="color:#64748b;">-</span>'}</td>
                        <td>${scoreDisplay}</td>
                        <td class="${statusClass}">${statusDisplay}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            // Update Cards Summary
            document.getElementById('totalKaryawan').innerText = totalKaryawan;
            document.getElementById('totalPesertaVsStaff').innerText = `${totalStaffDinilai} / ${totalKaryawan}`;
            document.getElementById('totalLulus').innerText = totalLulus;
            document.getElementById('totalRemidi').innerText = totalRemidi;
        }

        // Jalankan Fungsi
        renderDashboard();
    </script>
</body>
</html>

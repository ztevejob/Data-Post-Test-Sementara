<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilai Post Test Sementara - MAPTECH</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse for Google Sheets CSV Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f4f7fe;
            color: #2b3674;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
            text-align: center;
        }

        .badge-lulus { background-color: #e6f9f0; color: #05cd99; }
        .badge-remidi { background-color: #ffeef0; color: #ee5d50; }
        .badge-join { background-color: #e9f3ff; color: #2b77e5; }
        .badge-absent { background-color: #fff8e6; color: #ffb800; }
        .badge-default { background-color: #f4f7fe; color: #707eae; }

        .table-responsive::-webkit-scrollbar { height: 6px; width: 6px; }
        .table-responsive::-webkit-scrollbar-track { background: #f1f1f1; }
        .table-responsive::-webkit-scrollbar-thumb { background: #c3cadb; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 p-3 md:p-6">

    <!-- MAIN APP WRAPPER -->
    <div class="max-w-7xl mx-auto w-full bg-white rounded-2xl p-4 md:p-6 shadow-sm border border-slate-200">
        
        <!-- ERROR MESSAGE CONTAINER -->
        <div id="error-alert" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-triangle-exclamation text-rose-500 text-base"></i>
                <span id="error-message-text">Gagal memperbarui data dari Google Sheets. Pastikan hak akses spreadsheet sudah 'Anyone with the link'.</span>
            </div>
            <button onclick="fetchSheetData()" class="px-2.5 py-1 bg-rose-600 hover:bg-rose-700 text-white rounded-lg font-semibold transition-colors">Coba Lagi</button>
        </div>

        <!-- HEADER SECTION -->
        <div class="pb-3 md:pb-4 mb-4 md:mb-6 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
            <div>
                <h2 class="text-lg md:text-2xl font-bold text-slate-900" id="page-title">Nilai Post Test Sementara</h2>
                <p class="text-xs text-slate-400 mt-0.5">Concept & Curation by <span class="text-slate-600 font-semibold">Novi Riyanto</span></p>
            </div>
            <div class="flex items-center gap-2 text-xs text-slate-500 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg w-fit">
                <span class="flex items-center gap-1.5 font-bold text-emerald-600">
                    <i class="fa-solid fa-bolt"></i> AutoSync
                </span>
                <span class="text-slate-300">|</span>
                <span id="sync-timestamp">Memuat...</span>
            </div>
        </div>

        <!-- KARTU STATISTIK UTAMA -->
        <div id="management-stats-container" class="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4 mb-6">
            <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-lg">
                    <i class="fa-solid fa-user-group"></i>
                </div>
                <div>
                    <span class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Total Karyawan</span>
                    <h3 id="stat-total-karyawan" class="text-xl font-bold text-slate-800">0</h3>
                </div>
            </div>

            <div class="bg-slate-50 border border-slate-200 p-4 rounded-xl flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-lg">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <span class="text-[10px] text-slate-500 uppercase font-bold tracking-wider">Total Peserta (Aktif Sesi)</span>
                    <h3 id="stat-total" class="text-xl font-bold text-slate-800">0</h3>
                </div>
            </div>
        </div>

        <!-- TABEL DATA LANGSUNG DARI FETCH -->
        <div class="table-responsive overflow-x-auto border border-slate-200 rounded-xl max-h-[600px]">
            <table class="w-full text-xs text-left whitespace-nowrap">
                <thead id="table-head" class="bg-slate-100 sticky top-0 z-10 border-b border-slate-200">
                    <!-- Header dinamis dari fetch -->
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-100 bg-white">
                    <tr>
                        <td class="text-center py-6 text-indigo-600">
                            <i class="fa-solid fa-spinner fa-spin"></i> Memuat data dari Google Sheets...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        const SHEET_ID = "1Ckk2YocjioES8EKEkT3bjHy_56tUShglGPBCpYCyh5Y";
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

        document.addEventListener("DOMContentLoaded", () => {
            fetchSheetData();
        });

        function updateTimestamp() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            document.getElementById("sync-timestamp").innerText = `${dateStr}, ${timeStr} WIB`;
        }

        function fetchSheetData() {
            const errorAlert = document.getElementById("error-alert");
            errorAlert.classList.add("hidden");

            fetch(CSV_URL)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP Error Status: ${response.status}`);
                    return response.text();
                })
                .then(csvText => {
                    // Deteksi jika Google merespons dengan HTML (misal halaman login/akses terbatas)
                    if (csvText.trim().startsWith("<!DOCTYPE html>") || csvText.trim().startsWith("<html")) {
                        throw new Error("Akses Google Sheets dibatasi. Pastikan pengaturan berbagi file diset ke 'Anyone with the link'.");
                    }

                    // Parse sebagai Array 2D (header: false) untuk menangani offset baris di Google Sheets
                    Papa.parse(csvText, {
                        header: false,
                        skipEmptyLines: 'greedy',
                        complete: function(results) {
                            const rawRows = results.data;

                            if (!rawRows || rawRows.length === 0) {
                                renderEmptyTable();
                                return;
                            }

                            // Cari baris pertama yang memiliki isi sebagai header
                            let headerIdx = rawRows.findIndex(row => row.some(cell => String(cell).trim() !== ""));

                            if (headerIdx === -1) {
                                renderEmptyTable();
                                return;
                            }

                            const headers = rawRows[headerIdx].map((h, i) => String(h).trim() || `Kolom ${i + 1}`);
                            const dataRows = rawRows.slice(headerIdx + 1).filter(row => row.some(cell => String(cell).trim() !== ""));

                            updateTimestamp();
                            renderTableData(headers, dataRows);

                            // Update Statistik
                            document.getElementById("stat-total-karyawan").innerText = dataRows.length;
                            document.getElementById("stat-total").innerText = dataRows.length;
                        },
                        error: function(err) {
                            throw new Error("Gagal memparsing data CSV: " + err.message);
                        }
                    });
                })
                .catch(err => {
                    console.error("Error fetching sheet:", err);
                    const errorMsg = document.getElementById("error-message-text");
                    if (errorMsg) errorMsg.innerText = err.message;
                    errorAlert.classList.remove("hidden");
                    renderEmptyTable();
                });
        }

        function renderEmptyTable() {
            const tbody = document.getElementById("table-body");
            tbody.innerHTML = `<tr><td class="text-center py-6 text-slate-400">Data tidak ditemukan di Google Sheets.</td></tr>`;
            document.getElementById("stat-total-karyawan").innerText = "0";
            document.getElementById("stat-total").innerText = "0";
        }

        function renderTableData(headers, rows) {
            const thead = document.getElementById("table-head");
            const tbody = document.getElementById("table-body");

            thead.innerHTML = "";
            tbody.innerHTML = "";

            if (rows.length === 0) {
                renderEmptyTable();
                return;
            }

            // 1. Render Header
            const trHead = document.createElement("tr");
            headers.forEach(headerText => {
                const th = document.createElement("th");
                th.className = "p-3 font-semibold text-slate-700 bg-slate-100 border-b border-slate-200 text-left";
                th.innerText = headerText;
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);

            // 2. Render Baris Data
            const fragment = document.createDocumentFragment();
            rows.forEach(row => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50 transition-colors";

                headers.forEach((_, colIndex) => {
                    const td = document.createElement("td");
                    td.className = "p-3 border-b border-slate-100";
                    const cellVal = row[colIndex] !== undefined && row[colIndex] !== null ? String(row[colIndex]).trim() : "";
                    
                    // Format tampilan badge otomatis untuk status Lulus/Remidi jika ada
                    if (cellVal.toLowerCase() === "lulus") {
                        td.innerHTML = `<span class="badge badge-lulus">Lulus</span>`;
                    } else if (cellVal.toLowerCase() === "remidi" || cellVal.toLowerCase() === "remedi") {
                        td.innerHTML = `<span class="badge badge-remidi">Remidi</span>`;
                    } else {
                        td.innerText = cellVal !== "" ? cellVal : "-";
                    }
                    
                    tr.appendChild(td);
                });

                fragment.appendChild(tr);
            });

            tbody.appendChild(fragment);
        }
    </script>
</body>
</html>
